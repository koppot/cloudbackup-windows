name: CI/CD Pipeline — Windows Portability & Distribution Build

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-windows:
    name: Build & Validate on Windows (windows-latest)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run Unit Test Suite
        run: |
          python -m pytest -v

      - name: Build PyInstaller Standalone Executable
        run: |
          pyinstaller --noconfirm CloudBackup.spec

      - name: Frozen Executable Smoke Test
        run: |
          .\dist\CloudBackup\CloudBackup.exe --version

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/CloudBackupInstaller.iss

      - name: Generate SHA-256 Artifact Hashes
        shell: powershell
        run: |
          Compress-Archive -Path dist\CloudBackup\* -DestinationPath dist\CloudBackup-x64.zip
          Get-FileHash -Algorithm SHA256 dist\CloudBackup-Setup.exe, dist\CloudBackup-x64.zip | Format-List | Out-File dist\checksums.sha256
          Get-Content dist\checksums.sha256

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudBackup-Windows-x64-Python${{ matrix.python-version }}
          path: |
            dist/CloudBackup-Setup.exe
            dist/CloudBackup-x64.zip
            dist/checksums.sha256
          if-no-files-found: error

  unit-tests-linux:
    name: Platform-Neutral Unit Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt pytest

      - name: Run Platform-Neutral Unit Tests
        run: |
          python -m pytest -v tests/test_dedup.py tests/test_rotation.py tests/test_schema.py
