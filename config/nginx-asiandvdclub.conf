# NGINX Configuration for ADC Backup Administrative Interface
# Site: asiandvdclub.org
# Public Path: https://asiandvdclub.org/backup
# Place in: /etc/nginx/sites-available/asiandvdclub.org.conf

server {
    listen 443 ssl http2;
    server_name asiandvdclub.org www.asiandvdclub.org;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate         /etc/letsencrypt/live/asiandvdclub.org/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/asiandvdclub.org/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" always;

    # ── Main Website ────────────────────────────────────────────────────────
    location / {
        # ... main ADC website (e.g. try_files $uri $uri/ /index.php?$query_string;) ...
    }

    # ── ADC Backup Administrative Interface ─────────────────────────────────
    # The '^~' modifier forces NGINX to intercept ALL requests starting with /backup
    # BEFORE main website try_files or php regex blocks can hijack & redirect to index.
    location ^~ /backup {
        proxy_pass http://127.0.0.1:8080;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /backup;

        # Timeouts for long-running dry-run/restore requests
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Buffer settings
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }
}
