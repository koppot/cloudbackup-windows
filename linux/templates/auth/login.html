{% set hide_sidebar = true %}
{% extends "base.html" %}
{% block title %}Login - ADC Backup System{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 100%;">
    <div class="card" style="width: 300px;">
        <h2>Login</h2>
        <form method="POST" action="/auth/login">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required style="width: 100%; box-sizing: border-box;">
            </div>
            <div class="form-group">
                <label for="totp_token">TOTP Token</label>
                <input type="text" id="totp_token" name="totp_token" required style="width: 100%; box-sizing: border-box;">
            </div>
            <button type="submit" style="width: 100%;">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
