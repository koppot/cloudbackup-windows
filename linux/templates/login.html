{% extends "base.html" %}
{% block title %}Login — ADC Backup{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 5rem auto;" class="card">
  <h2 style="margin-bottom: 1.5rem; text-align: center;">ADC Backup Login</h2>
  {% if error %}
    <div class="flash flash-error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" value="admin" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Continue to TOTP</button>
  </form>
</div>
{% endblock %}
