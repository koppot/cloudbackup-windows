{% extends "base.html" %}
{% block title %}Setup TOTP — ADC Backup{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 3rem auto;" class="card">
  <h2 style="margin-bottom: 1rem; text-align: center;">Setup Two-Factor Authentication</h2>
  <p style="color: var(--text-secondary); margin-bottom: 1.5rem; text-align: center;">
    Scan this QR code with Google Authenticator, 1Password, or Authy.
  </p>

  <div style="text-align: center; margin-bottom: 1.5rem;">
    <img src="/totp/qr.png?uri={{ uri }}" alt="TOTP QR Code" style="border-radius: 0.5rem; background: white; padding: 0.5rem;">
    <p style="font-family: monospace; margin-top: 0.75rem; color: var(--accent-blue);">{{ secret }}</p>
  </div>

  <form method="POST">
    <input type="hidden" name="secret" value="{{ secret }}">
    <div class="form-group">
      <label for="code">Enter 6-Digit Code to Confirm</label>
      <input type="text" id="code" name="code" class="form-control" placeholder="123456" autocomplete="off" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Complete Setup</button>
  </form>
</div>
{% endblock %}
