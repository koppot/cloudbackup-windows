{% extends "base.html" %}
{% block title %}TOTP Verification — ADC Backup{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 5rem auto;" class="card">
  <h2 style="margin-bottom: 1.5rem; text-align: center;">Two-Factor Authentication</h2>
  {% if error %}
    <div class="flash flash-error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="form-group">
      <label for="code">6-Digit Code</label>
      <input type="text" id="code" name="code" class="form-control" placeholder="123456" autocomplete="off" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Verify & Log In</button>
  </form>
</div>
{% endblock %}
