<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudBackup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;
  --sep:rgba(84,84,88,.36);
  --t1:#fff;--t2:rgba(235,235,245,.6);--t3:rgba(235,235,245,.3);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
  --r:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);-webkit-font-smoothing:antialiased}

.scroll{height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stack{max-width:400px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}

/* ── NAV BAR ── */
.nav{display:flex;align-items:center;padding:6px 0 2px}
.nav-left{display:flex;align-items:center;gap:8px;flex:1}
.nav h1{font-size:.88rem;font-weight:600}
.nav-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.nav-dot.busy{background:var(--orange);animation:p 1.2s infinite ease-in-out}
.nav-dot.err{background:var(--red)}
.nav-dot.off{background:var(--t3)}
@keyframes p{50%{opacity:.25}}

/* ── WIDGET (card) ── */
.w{background:var(--card);border-radius:var(--r);overflow:hidden}
.w-pad{padding:22px 20px}

/* ── STATUS WIDGET ── */
.w-status{text-align:center}
.shield{
  width:100px;height:100px;margin:0 auto 18px;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.shield-ring{position:absolute;inset:0;transform:rotate(-90deg)}
.shield-ring circle{fill:none;stroke-width:4;stroke-linecap:round;stroke:rgba(255,255,255,.04)}
.shield-ring .arc{stroke:var(--blue);stroke-dasharray:282.7;stroke-dashoffset:282.7;transition:stroke-dashoffset .8s ease}
.shield-icon{position:relative;z-index:1}

.s-label{font-size:1.1rem;font-weight:600;margin-bottom:4px}
.s-sub{font-size:.72rem;color:var(--t3)}

.s-actions{display:flex;justify-content:center;gap:10px;margin-top:18px}
.s-btn{
  width:48px;height:48px;border-radius:50%;border:none;
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .18s,transform .12s;
}
.s-btn:hover{background:rgba(255,255,255,.1)}
.s-btn:active{transform:scale(.92)}
.s-btn.primary{background:rgba(10,132,255,.18)}
.s-btn.primary:hover{background:rgba(10,132,255,.28)}
.s-btn:disabled{opacity:.2;cursor:default;transform:none}
.s-btn svg{pointer-events:none}

/* ── DRIVE WIDGET ── */
.w-drive .top{display:flex;align-items:center;gap:14px}
.w-drive .info{flex:1;min-width:0}
.w-drive .name{font-size:.82rem;font-weight:500}
.w-drive .detail{font-size:.66rem;color:var(--t3);margin-top:3px}
.w-drive .bar{height:3px;background:rgba(255,255,255,.05);border-radius:2px;margin-top:10px;overflow:hidden}
.w-drive .bar-f{height:100%;background:var(--blue);border-radius:2px;transition:width .5s}
.w-drive .empty{text-align:center;padding:8px 0}
.w-drive .empty-label{font-size:.74rem;color:var(--t3);margin-bottom:12px}

/* ── FOLDERS WIDGET ── */
.w-folders .heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.w-folders .heading-left{display:flex;align-items:center;gap:8px}
.w-folders .heading span{font-size:.78rem;font-weight:500;color:var(--t2)}
.folder-list{display:flex;flex-direction:column;gap:0}
.folder-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--sep);
}
.folder-row:last-child{border-bottom:none}
.folder-row .fname{flex:1;font-size:.74rem;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-row .fdel{
  background:none;border:none;color:var(--t3);
  cursor:pointer;font-size:.7rem;padding:4px 6px;border-radius:6px;
  transition:color .15s,background .15s;
}
.folder-row .fdel:hover{color:var(--red);background:rgba(255,69,58,.1)}
.folders-empty{font-size:.72rem;color:var(--t3);text-align:center;padding:6px 0}

.add-row{
  display:flex;align-items:center;justify-content:center;
  padding:10px 0 2px;cursor:pointer;gap:5px;
  color:var(--blue);font-size:.74rem;font-weight:500;
  transition:opacity .15s;
}
.add-row:hover{opacity:.7}
.add-row svg{flex-shrink:0}

/* ── LOG WIDGET ── */
.w-log .log-head{
  display:flex;align-items:center;gap:8px;
  cursor:pointer;user-select:none;
}
.w-log .log-head svg{transition:transform .25s}
.w-log .log-head.open svg{transform:rotate(90deg)}
.w-log .log-head span{font-size:.74rem;color:var(--t3);font-weight:500}
.log-lines{
  display:none;
  max-height:160px;
  overflow-y:auto;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--sep);
}
.log-lines.open{display:block}
.log-lines p{
  margin:0;
  font-family:"SF Mono","Cascadia Code","Courier New",monospace;
  font-size:.58rem;line-height:1.85;color:rgba(235,235,245,.18);
}
.log-lines .lok{color:rgba(48,209,88,.6)}
.log-lines .lwarn{color:rgba(255,159,10,.6)}
.log-lines .lerr{color:rgba(255,69,58,.6)}

/* ── ROUND ADD ── */
.circle-add{
  width:32px;height:32px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.08);
  background:transparent;color:var(--t3);
  font-size:.95rem;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,color .15s;flex-shrink:0;
}
.circle-add:hover{border-color:rgba(10,132,255,.5);color:var(--blue)}

/* ── MODALS ── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:50;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{
  background:var(--card);border-radius:20px 20px 0 0;
  padding:28px 24px 36px;width:100%;max-width:400px;
  display:flex;flex-direction:column;gap:18px;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet h2{font-size:.92rem;font-weight:600;text-align:center}
.sheet p{font-size:.72rem;color:var(--t3);line-height:1.5;text-align:center}
.sheet input{
  background:rgba(118,118,128,.2);border:none;border-radius:12px;
  padding:12px 16px;color:#fff;font-size:.84rem;width:100%;outline:none;font-family:var(--font);
}
.sheet input:focus{box-shadow:0 0 0 2px rgba(10,132,255,.5)}
.sheet-btns{display:flex;flex-direction:column;gap:8px}
.btn-b{
  padding:13px;border-radius:12px;border:none;
  background:var(--blue);color:#fff;
  font-size:.84rem;font-weight:600;cursor:pointer;font-family:var(--font);
  transition:opacity .15s;
}
.btn-b:hover{opacity:.85}
.btn-g{
  padding:13px;border-radius:12px;border:none;
  background:rgba(118,118,128,.2);color:var(--t2);
  font-size:.84rem;cursor:pointer;font-family:var(--font);
}

/* ── TOAST ── */
#toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  background:var(--card2);border-radius:22px;
  padding:9px 20px;font-size:.74rem;color:var(--t2);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
#toast.show{opacity:1}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
</style>
</head>
<body>

<div class="scroll">
<div class="stack">

  <!-- NAV -->
  <div class="nav">
    <div class="nav-left">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="1.8"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>CloudBackup</h1>
    </div>
    <div class="nav-dot off" id="dot"></div>
  </div>

  <!-- STATUS WIDGET -->
  <div class="w">
    <div class="w-pad w-status">
      <div class="shield">
        <svg class="shield-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/><circle class="arc" id="arc" cx="50" cy="50" r="45"/></svg>
        <div class="shield-icon" id="shield-icon">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
      </div>
      <div class="s-label" id="s-label">Ready</div>
      <div class="s-sub" id="s-sub">Set up a drive and folders to begin</div>
      <div class="s-actions">
        <button class="s-btn primary" id="btn-run" onclick="runBackup()" title="Back up now">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--blue)"><polygon points="7,4 19,12 7,20"/></svg>
        </button>
        <button class="s-btn" id="btn-pause" onclick="pauseBackup()" disabled title="Pause">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--t3)"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <button class="s-btn" onclick="verifyBackup()" title="Verify">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- DRIVE WIDGET -->
  <div class="w" id="w-drive">
    <div class="w-pad w-drive" id="drive-body">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- FOLDERS WIDGET -->
  <div class="w">
    <div class="w-pad w-folders">
      <div class="heading">
        <div class="heading-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--blue)"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Folders</span>
        </div>
        <button class="circle-add" onclick="openFolder()" title="Add folder">+</button>
      </div>
      <div id="folder-list"></div>
    </div>
  </div>

  <!-- LOG WIDGET -->
  <div class="w">
    <div class="w-pad w-log">
      <div class="log-head" id="log-head" onclick="toggleLog()">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="var(--t3)"><polygon points="1,0 7,4 1,8"/></svg>
        <span>Activity</span>
      </div>
      <div class="log-lines" id="log-lines"></div>
    </div>
  </div>

</div>
</div>

<!-- Drive sheet -->
<div class="ov" id="dmod">
  <div class="sheet">
    <h2>Connect Google Drive</h2>
    <p>Sign in with your Google account to connect your cloud storage.</p>
    <div class="sheet-btns">
      <button class="btn-b" onclick="startOAuth()">Continue with Google</button>
      <button class="btn-g" onclick="closeDrive()">Cancel</button>
    </div>
  </div>
</div>

<!-- Folder sheet -->
<div class="ov" id="fmod">
  <div class="sheet">
    <h2>Add Folder</h2>
    <input id="fin" type="text" placeholder="C:\Users\You\Documents" autocomplete="off">
    <div class="sheet-btns">
      <button class="btn-b" onclick="addFolder()">Add Folder</button>
      <button class="btn-g" onclick="closeFolder()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
function toast(m,ms=2200){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),ms)}
async function api(u,o={}){try{const r=await fetch(u,o);return r.json()}catch{return {}}}

function setArc(pct){
  const c=$('arc'),circ=2*Math.PI*45;
  c.style.strokeDasharray=circ;
  c.style.strokeDashoffset=circ-(circ*Math.min(pct,100)/100);
}
function timeAgo(s){
  try{const ms=Date.now()-new Date(s).getTime(),m=Math.floor(ms/60000);
  if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);
  if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}catch{return s}
}

async function loadStatus(){
  const d=await api('/api/status');
  const dot=$('dot'),lbl=$('s-label'),sub=$('s-sub'),icon=$('shield-icon'),run=$('btn-run'),pause=$('btn-pause');
  if(!d||d.error){
    dot.className='nav-dot err';lbl.textContent='Offline';sub.textContent='Cannot reach backup service';
    icon.innerHTML='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
    setArc(0);return;
  }
  if(d.running){
    dot.className='nav-dot busy';lbl.textContent='Backing Up';sub.textContent='Transfer in progress\u2026';
    icon.innerHTML='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round"><path d="M12 2v4m0 12v4m-7.07-14.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>';
    run.classList.add('running');pause.disabled=false;setArc(d.progress||45);
  }else{
    run.classList.remove('running');pause.disabled=true;
    if(d.configured){
      dot.className='nav-dot';lbl.textContent='Protected';
      sub.textContent=d.last_run?'Last backup '+timeAgo(d.last_run):'Ready to back up';
      icon.innerHTML='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>';
      setArc(100);
    }else{
      dot.className='nav-dot off';lbl.textContent='Ready';sub.textContent='Set up a drive and folders to begin';
      icon.innerHTML='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
      setArc(0);
    }
  }
  if(d.logs?.length)renderLog(d.logs);
}

function renderLog(lines){
  const b=$('log-lines');b.innerHTML='';
  lines.slice(-40).forEach(l=>{const p=document.createElement('p');p.textContent=l;
    p.className=/error|fail/i.test(l)?'lerr':/warn/i.test(l)?'lwarn':/done|ok|complet|success/i.test(l)?'lok':'';
    b.appendChild(p)});b.scrollTop=b.scrollHeight;
}
function toggleLog(){$('log-head').classList.toggle('open');$('log-lines').classList.toggle('open')}

async function loadDrives(){
  const d=await api('/api/drives'),r=(d.remotes||[])[0],body=$('drive-body');
  if(r){
    const pct=Math.min(r.usage_pct||0,100);
    body.innerHTML=`<div class="top">
      <svg width="36" height="31" viewBox="0 0 87.3 78"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0-1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.5l5.85 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>
      <div class="info"><div class="name">${r.name||'Google Drive'}</div><div class="detail">${pct}% used</div></div>
    </div><div class="bar"><div class="bar-f" style="width:${pct}%"></div></div>`;
  }else{
    body.innerHTML=`<div class="empty">
      <svg width="44" height="38" viewBox="0 0 87.3 78" style="opacity:.4"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0-1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.5l5.85 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>
      <div class="empty-label">No cloud drive connected</div>
      <div class="add-row" onclick="openDrive()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Connect</div>
    </div>`;
  }
}

async function loadSources(){
  const d=await api('/api/sources'),src=d.sources||[],el=$('folder-list');
  if(!src.length){el.innerHTML='<div class="folders-empty">No folders selected</div><div class="add-row" onclick="openFolder()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add folder</div>';return}
  window._src=src;
  el.innerHTML='<div class="folder-list">'+src.map((s,i)=>
    `<div class="folder-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="var(--blue)" opacity=".6"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span class="fname" title="${s.path}">${s.path}</span><button class="fdel" onclick="rmSrc(${i})">Remove</button></div>`
  ).join('')+'</div>';
}
async function rmSrc(i){const s=(window._src||[])[i];if(!s)return;const fd=new FormData();fd.append('path',s.path);await api('/api/sources/remove',{method:'POST',body:fd});loadSources()}

async function runBackup(){const r=await api('/api/action/run',{method:'POST'});r.error?toast(r.error):(toast('Backup started'),loadStatus())}
async function pauseBackup(){await api('/api/action/pause',{method:'POST'});toast('Paused');loadStatus()}
async function verifyBackup(){toast('Verifying\u2026',5000);const r=await api('/api/action/verify',{method:'POST'});toast(r.ok?'Verified':'Verification failed')}

function openDrive(){$('dmod').classList.add('open')}
function closeDrive(){$('dmod').classList.remove('open')}
async function startOAuth(){
  closeDrive();toast('Opening sign-in\u2026',5000);
  const r=await api('/api/drives/wizard',{method:'POST'});
  if(r.error){toast(r.error,5000);return}
  if(r.auth_url)window.open(r.auth_url,'_blank');
  setTimeout(()=>{loadDrives();loadStatus()},12000);
}

function openFolder(){$('fmod').classList.add('open');$('fin').value='';setTimeout(()=>$('fin').focus(),80)}
function closeFolder(){$('fmod').classList.remove('open')}
async function addFolder(){
  const p=$('fin').value.trim();if(!p)return;
  const fd=new FormData();fd.append('path',p);
  const r=await api('/api/sources/add',{method:'POST',body:fd});
  r.error?toast(r.error):(toast('Added'),loadSources());closeFolder();
}
$('fin').addEventListener('keydown',e=>{if(e.key==='Enter')addFolder()});
['dmod','fmod'].forEach(id=>$(id).addEventListener('click',function(e){if(e.target===this)this.classList.remove('open')}));
