<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudBackup</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}

    /* ── Header ── */
    header{display:flex;align-items:center;gap:12px;padding:18px 28px;border-bottom:1px solid #1e1e1e;background:#0d0d0d}
    header svg{width:26px;height:26px;flex-shrink:0}
    header h1{font-size:1.1rem;font-weight:700;letter-spacing:-.01em;flex:1}
    #dot{width:10px;height:10px;border-radius:50%;background:#52525b;flex-shrink:0;transition:background .4s}
    #dot.ok{background:#22c55e}
    #dot.busy{background:#f59e0b;animation:pulse 1s infinite}
    #dot.err{background:#ef4444}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    /* ── Main grid ── */
    main{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:16px;padding:20px 28px}

    .card{background:#141414;border:1px solid #262626;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:14px;min-height:220px}

    /* log card full-width */
    .card.log{grid-column:1/-1;min-height:160px;align-items:flex-start;justify-content:flex-start;padding:18px 20px;gap:10px}

    /* ── Backup card ── */
    #btn-run{width:80px;height:80px;border-radius:50%;border:2.5px solid #38bdf8;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
    #btn-run:hover{background:rgba(56,189,248,.12)}
    #btn-run svg{width:32px;height:32px;fill:#38bdf8;margin-left:4px}
    #btn-run.running{border-color:#f59e0b}
    #btn-run.running svg{fill:#f59e0b}

    .backup-meta{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;color:#737373}
    .backup-meta span{display:flex;align-items:center;gap:5px}

    .btn-row{display:flex;gap:8px;margin-top:2px}
    .btn-sm{padding:6px 14px;border-radius:8px;border:1px solid #404040;background:transparent;color:#a3a3a3;font-size:.75rem;cursor:pointer;transition:border-color .2s,color .2s}
    .btn-sm:hover{border-color:#38bdf8;color:#38bdf8}
    .btn-sm:disabled{opacity:.4;cursor:default}

    /* ── Drive card ── */
    .drive-logo{font-size:2.8rem;line-height:1}
    .storage-bar-wrap{width:120px;background:#262626;border-radius:4px;height:5px;overflow:hidden}
    .storage-bar-fill{height:100%;background:#38bdf8;border-radius:4px;transition:width .6s}
    .storage-label{font-size:.72rem;color:#737373}

    .btn-add{width:40px;height:40px;border-radius:50%;border:1.5px solid #404040;background:transparent;cursor:pointer;font-size:1.2rem;color:#a3a3a3;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s}
    .btn-add:hover{border-color:#38bdf8;color:#38bdf8}

    /* ── Sources card ── */
    .folder-icon{font-size:2.6rem;line-height:1}
    .folder-list{display:flex;flex-direction:column;gap:6px;width:100%;max-height:120px;overflow-y:auto}
    .folder-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1e1e1e;border-radius:8px;padding:6px 10px;font-size:.72rem;color:#a3a3a3;cursor:default}
    .folder-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
    .folder-chip button{background:none;border:none;color:#525252;cursor:pointer;font-size:.85rem;padding:0 2px;flex-shrink:0}
    .folder-chip button:hover{color:#ef4444}

    /* ── Log card ── */
    .log-header{display:flex;align-items:center;gap:8px;font-size:.78rem;color:#525252;font-family:monospace}
    #log-box{flex:1;width:100%;overflow-y:auto;max-height:120px;font-family:'Courier New',monospace;font-size:.7rem;color:#52525b;line-height:1.6;padding-top:4px}
    #log-box p{margin:0}
    #log-box p.info{color:#737373}
    #log-box p.warn{color:#d97706}
    #log-box p.err{color:#ef4444}
    #log-box p.ok{color:#22c55e}

    /* ── Toast ── */
    #toast{position:fixed;bottom:24px;right:24px;background:#1e1e1e;border:1px solid #404040;border-radius:10px;padding:10px 18px;font-size:.78rem;color:#a3a3a3;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999}
    #toast.show{opacity:1}

    /* ── Modals ── */
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
    .modal-bg.open{display:flex}
    .modal{background:#141414;border:1px solid #333;border-radius:16px;padding:28px;width:380px;display:flex;flex-direction:column;gap:16px}
    .modal h2{font-size:.95rem;font-weight:600}
    .modal input,.modal select{background:#0a0a0a;border:1px solid #404040;border-radius:8px;padding:9px 12px;color:#f5f5f5;font-size:.82rem;width:100%;outline:none}
    .modal input:focus,.modal select:focus{border-color:#38bdf8}
    .modal-btns{display:flex;gap:8px;justify-content:flex-end}
    .btn-primary{padding:8px 18px;border-radius:8px;border:none;background:#38bdf8;color:#000;font-size:.82rem;font-weight:600;cursor:pointer}
    .btn-cancel{padding:8px 18px;border-radius:8px;border:1px solid #404040;background:transparent;color:#a3a3a3;font-size:.82rem;cursor:pointer}

    /* scroll */
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  </style>
</head>
<body>

<!-- Header -->
<header>
  <svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
  </svg>
  <h1>CloudBackup</h1>
  <div id="dot" title="Status"></div>
</header>

<!-- Main -->
<main>

  <!-- Backup card -->
  <div class="card">
    <button id="btn-run" title="Run backup now" onclick="runBackup()">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    </button>
    <div class="backup-meta">
      <span id="last-run-line">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="last-run">—</span>
      </span>
      <span id="next-run-line">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12"/><line x1="12" y1="12" x2="12" y2="12"/></svg>
        <span id="next-run">—</span>
      </span>
    </div>
    <div class="btn-row">
      <button class="btn-sm" id="btn-pause" onclick="pauseBackup()" disabled title="Pause">⏸</button>
      <button class="btn-sm" onclick="verifyBackup()" title="Verify">✓ Verify</button>
    </div>
  </div>

  <!-- Drive card -->
  <div class="card" id="drive-card">
    <div class="drive-logo">&#9651;</div><!-- replaced with G logo by JS -->
    <div class="storage-bar-wrap"><div class="storage-bar-fill" id="storage-fill" style="width:0%"></div></div>
    <div class="storage-label" id="storage-label">No drive connected</div>
    <button class="btn-add" id="btn-add-drive" onclick="openDriveModal()" title="Add Google Drive">＋</button>
  </div>

  <!-- Sources card -->
  <div class="card" id="sources-card">
    <div class="folder-icon">🗂</div>
    <div class="folder-list" id="folder-list"><span style="font-size:.75rem;color:#525252">No folders added</span></div>
    <button class="btn-add" onclick="openFolderModal()" title="Add folder">＋</button>
  </div>

  <!-- Log card -->
  <div class="card log">
    <div class="log-header">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="9 9 12 12 9 15"/><line x1="15" y1="12" x2="15" y2="12"/></svg>
      Log
    </div>
    <div id="log-box"></div>
  </div>

</main>

<!-- Add Drive Modal -->
<div class="modal-bg" id="drive-modal">
  <div class="modal">
    <h2>🔗 Connect Google Drive</h2>
    <p style="font-size:.78rem;color:#737373">A browser tab will open for Google sign-in. Return here when done.</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeDriveModal()">Cancel</button>
      <button class="btn-primary" onclick="startOAuth()">Open Google Sign-in</button>
    </div>
  </div>
</div>

<!-- Add Folder Modal -->
<div class="modal-bg" id="folder-modal">
  <div class="modal">
    <h2>📁 Add Source Folder</h2>
    <input id="folder-path-input" type="text" placeholder="e.g. C:\Users\You\Documents" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeFolderModal()">Cancel</button>
      <button class="btn-primary" onclick="addFolder()">Add</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  /* ── Utilities ── */
  function toast(msg, ms=2800){
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), ms);
  }
  async function api(path, opts={}){
    const r=await fetch(path, opts);
    return r.json().catch(()=>({}));
  }

  /* ── Status polling ── */
  let busyTimer=null;
  async function loadStatus(){
    const d=await api('/api/status').catch(()=>({}));
    const dot=document.getElementById('dot');
    if(d.error){dot.className='err';return}
    if(d.running){dot.className='ok busy';}
    else if(d.configured){dot.className='ok';}
    else{dot.className='';}

    const run=document.getElementById('btn-run');
    const pause=document.getElementById('btn-pause');
    if(d.running){
      run.classList.add('running');
      run.title='Running…';
      pause.disabled=false;
    } else {
      run.classList.remove('running');
      run.title='Run backup now';
      pause.disabled=true;
    }

    if(d.last_run) document.getElementById('last-run').textContent=fmtDate(d.last_run);
    if(d.next_run) document.getElementById('next-run').textContent=fmtDate(d.next_run);

    if(d.logs && d.logs.length) renderLogs(d.logs);
  }

  function fmtDate(s){
    if(!s||s==='—') return '—';
    try{
      const dt=new Date(s);
      return dt.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    }catch{return s}
  }

  /* ── Log renderer ── */
  function renderLogs(lines){
    const box=document.getElementById('log-box');
    box.innerHTML='';
    const last=lines.slice(-40);
    last.forEach(l=>{
      const p=document.createElement('p');
      p.textContent=l;
      if(/error|fail/i.test(l)) p.className='err';
      else if(/warn/i.test(l)) p.className='warn';
      else if(/success|complet|done/i.test(l)) p.className='ok';
      else p.className='info';
      box.appendChild(p);
    });
    box.scrollTop=box.scrollHeight;
  }

  /* ── Drives ── */
  async function loadDrives(){
    const d=await api('/api/drives').catch(()=>({}));
    const remotes=d.remotes||[];
    const btn=document.getElementById('btn-add-drive');
    const label=document.getElementById('storage-label');
    const fill=document.getElementById('storage-fill');
    const logo=document.querySelector('.drive-logo');

    if(remotes.length===0){
      logo.textContent='△';
      label.textContent='No drive connected';
      fill.style.width='0%';
      btn.style.display='flex';
    } else {
      const r=remotes[0];
      logo.innerHTML='<svg width="44" height="38" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>';
      label.textContent=r.name||'Connected';
      const pct=r.usage_pct||0;
      fill.style.width=Math.min(pct,100)+'%';
      btn.style.display='none';
    }
  }

  /* ── Sources ── */
  async function loadSources(){
    const d=await api('/api/sources').catch(()=>({}));
    const sources=d.sources||[];
    const list=document.getElementById('folder-list');
    if(sources.length===0){
      list.innerHTML='<span style="font-size:.75rem;color:#525252">No folders added</span>';
      return;
    }
    list.innerHTML=sources.map(s=>`
      <div class="folder-chip">
        <span title="${s.path}">📁 ${s.path}</span>
        <button onclick="removeSource('${s.path.replace(/'/g,"\\'")}')">✕</button>
      </div>`).join('');
  }

  async function removeSource(path){
    const fd=new FormData(); fd.append('path',path);
    await api('/api/sources/remove',{method:'POST',body:fd});
    loadSources();
  }

  /* ── Actions ── */
  async function runBackup(){
    const r=await api('/api/action/run',{method:'POST'});
    if(r.error) toast('⚠ '+r.error);
    else{ toast('▶ Backup started'); loadStatus(); }
  }
  async function pauseBackup(){
    await api('/api/action/pause',{method:'POST'});
    toast('⏸ Paused'); loadStatus();
  }
  async function verifyBackup(){
    toast('🔍 Verifying…',5000);
    const r=await api('/api/action/verify',{method:'POST'});
    toast(r.ok?'✓ Verified OK':'⚠ Verify failed');
  }

  /* ── Drive modal ── */
  function openDriveModal(){ document.getElementById('drive-modal').classList.add('open'); }
  function closeDriveModal(){ document.getElementById('drive-modal').classList.remove('open'); }
  async function startOAuth(){
    closeDriveModal();
    toast('🔗 Opening Google sign-in…', 5000);
    const r=await api('/api/drives/wizard',{method:'POST'});
    if(r.error){ toast('⚠ '+r.error, 5000); return; }
    if(r.auth_url){ window.open(r.auth_url,'_blank'); toast('✓ Sign in completed? Refreshing…', 8000); }
    setTimeout(()=>{ loadDrives(); loadStatus(); }, 10000);
  }

  /* ── Folder modal ── */
  function openFolderModal(){ document.getElementById('folder-modal').classList.add('open'); document.getElementById('folder-path-input').value=''; }
  function closeFolderModal(){ document.getElementById('folder-modal').classList.remove('open'); }
  async function addFolder(){
    const path=document.getElementById('folder-path-input').value.trim();
    if(!path) return;
    const fd=new FormData(); fd.append('path',path);
    const r=await api('/api/sources/add',{method:'POST',body:fd});
    if(r.error) toast('⚠ '+r.error);
    else{ toast('📁 Folder added'); loadSources(); }
    closeFolderModal();
  }
  document.getElementById('folder-path-input').addEventListener('keydown',e=>{ if(e.key==='Enter') addFolder(); });

  /* ── Close modals on backdrop click ── */
  ['drive-modal','folder-modal'].forEach(id=>{
    document.getElementById(id).addEventListener('click',function(e){ if(e.target===this) this.classList.remove('open'); });
  });

  /* ── Boot ── */
  function refresh(){ loadStatus(); loadDrives(); loadSources(); }
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
