<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudBackup</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0a0a0a; color: #f5f5f5; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

/* HEADER */
header {
  height: 52px;
  display: flex; align-items: center; gap: 11px;
  padding: 0 22px;
  background: #111;
  border-bottom: 1px solid #1f1f1f;
}
header .h-title { font-size: 1.05rem; font-weight: 700; flex: 1; }
#dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
#dot.busy { background: #f59e0b; animation: p 1s infinite; }
#dot.err  { background: #ef4444; }
#dot.off  { background: #3f3f46; }
@keyframes p { 0%,100%{opacity:1} 50%{opacity:.3} }

/* GRID  */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 3fr 1fr;
  gap: 14px;
  padding: 18px 20px;
  height: calc(100vh - 52px);
}

/* CARD BASE */
.card {
  background: #161616;
  border: 1px solid #2e2e2e;
  border-radius: 14px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0; padding: 24px 20px;
  overflow: hidden; min-height: 0;
}

/* LOG CARD */
.card.log {
  grid-column: 1/-1;
  flex-direction: row;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 18px 20px;
  gap: 20px;
}

/* ── BACKUP CARD ── */
#btn-run {
  width: 86px; height: 86px;
  border-radius: 50%;
  border: 2.5px solid #29b6f6;
  background: transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .2s;
  margin-bottom: 22px;
}
#btn-run:hover { background: rgba(41,182,246,.1); }
#btn-run.running { border-color: #f59e0b; }
#btn-run.running .tri { fill: #f59e0b; }
.tri { fill: #29b6f6; transform: translateX(3px); }

.meta-row {
  display: flex; align-items: center; justify-content: center;
  gap: 7px; width: 100%;
}
.meta-row + .meta-row { margin-top: 10px; }

.meta-time-val {
  font-size: 1.25rem; font-weight: 600;
  color: #e5e5e5; line-height: 1;
}
.meta-date-val {
  font-size: .82rem; color: #737373;
}

.btn-row {
  display: flex; gap: 8px;
  margin-top: 18px;
}
.btn-sm {
  padding: 5px 13px; border-radius: 8px;
  border: 1px solid #2a2a2a; background: transparent;
  color: #525252; font-size: .72rem; cursor: pointer;
  transition: border-color .2s, color .2s;
}
.btn-sm:hover:not(:disabled) { border-color: #29b6f6; color: #29b6f6; }
.btn-sm:disabled { opacity: .3; cursor: default; }

/* ── DRIVE CARD ── */
.drive-svg { flex-shrink: 0; margin-bottom: 16px; }
.bar-wrap { width: 130px; height: 4px; background: #222; border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: #29b6f6; border-radius: 3px; transition: width .6s; }
.lbl { font-size: .7rem; color: #525252; margin-top: 8px; }

/* ── ADD BUTTON ── */
.btn-add {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1.5px solid #2e2e2e;
  background: transparent;
  color: #525252; font-size: 1.2rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  margin-top: 14px;
  transition: border-color .2s, color .2s;
  line-height: 1; flex-shrink: 0;
}
.btn-add:hover { border-color: #29b6f6; color: #29b6f6; }

/* ── FOLDERS CARD ── */
.folders-img { width: 76px; height: 76px; object-fit: contain; flex-shrink: 0; margin-bottom: 14px; }

.chip-row {
  display: flex; flex-wrap: wrap;
  gap: 6px; justify-content: center;
  width: 100%;
}
.chip {
  display: flex; align-items: center; gap: 5px;
  background: #1a1a1a; border-radius: 20px;
  padding: 4px 10px;
  font-size: .68rem; color: #737373;
  cursor: default; white-space: nowrap;
}
.chip svg { flex-shrink: 0; }
.chip .del { background: none; border: none; color: #3f3f46; cursor: pointer; padding: 0 0 0 4px; font-size: .75rem; line-height: 1; }
.chip .del:hover { color: #ef4444; }
.chip-empty { font-size: .72rem; color: #3f3f46; }

/* ── LOG CARD ── */
.log-icon-col {
  flex-shrink: 0;
  display: flex; align-items: flex-start; padding-top: 2px;
}
.log-text-col {
  flex: 1; min-width: 0;
  overflow-y: auto;
  height: 100%;
  font-family: 'Courier New', monospace;
  font-size: .67rem; line-height: 1.75;
  color: #3f3f46;
}
.log-text-col p { margin: 0; }
.log-text-col p.info { color: #525252; }
.log-text-col p.ok   { color: #16a34a; }
.log-text-col p.warn { color: #d97706; }
.log-text-col p.err  { color: #dc2626; }

/* MODALS */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:50; align-items:center; justify-content:center; }
.overlay.open { display:flex; }
.modal { background:#161616; border:1px solid #2a2a2a; border-radius:16px; padding:26px 22px; width:350px; display:flex; flex-direction:column; gap:14px; }
.modal h2 { font-size:.88rem; font-weight:600; }
.modal p  { font-size:.73rem; color:#525252; line-height:1.5; }
.modal input { background:#0a0a0a; border:1px solid #2a2a2a; border-radius:8px; padding:8px 12px; color:#f5f5f5; font-size:.8rem; width:100%; outline:none; }
.modal input:focus { border-color:#29b6f6; }
.modal-btns { display:flex; gap:8px; justify-content:flex-end; }
.btn-primary { padding:7px 16px; border-radius:8px; border:none; background:#29b6f6; color:#000; font-size:.78rem; font-weight:600; cursor:pointer; }
.btn-cancel  { padding:7px 16px; border-radius:8px; border:1px solid #2a2a2a; background:transparent; color:#737373; font-size:.78rem; cursor:pointer; }

/* TOAST */
#toast { position:fixed; bottom:18px; right:18px; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px; padding:8px 15px; font-size:.73rem; color:#a3a3a3; opacity:0; pointer-events:none; transition:opacity .25s; z-index:99; }
#toast.show { opacity:1; }

::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:4px; }
</style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f5f5f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
  </svg>
  <span class="h-title">CloudBackup</span>
  <div id="dot" class="off"></div>
</header>

<div class="grid">

  <!-- ═══ BACKUP CARD ═══ -->
  <div class="card">
    <button id="btn-run" onclick="runBackup()" title="Run backup now">
      <svg width="34" height="34" viewBox="0 0 24 24"><polygon class="tri" points="6,3 20,12 6,21"/></svg>
    </button>

    <div class="meta-row">
      <!-- clock icon -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="meta-time-val" id="time-val">—</span>
    </div>

    <div class="meta-row">
      <!-- checkmark circle -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span class="meta-date-val" id="date-val">—</span>
    </div>

    <div class="btn-row">
      <button class="btn-sm" id="btn-pause" onclick="pauseBackup()" disabled>⏸</button>
      <button class="btn-sm" onclick="verifyBackup()">✓ Verify</button>
    </div>
  </div>

  <!-- ═══ DRIVE CARD ═══ -->
  <div class="card">
    <svg class="drive-svg" width="76" height="66" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg">
      <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
      <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/>
      <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
      <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
      <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
      <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
    </svg>
    <div class="bar-wrap"><div class="bar-fill" id="storage-fill" style="width:0%"></div></div>
    <div class="lbl" id="storage-lbl">No drive connected</div>
    <button class="btn-add" id="btn-add-drive" onclick="openDriveModal()" title="Add Google Drive">+</button>
  </div>

  <!-- ═══ FOLDERS CARD ═══ -->
  <div class="card">
    <img class="folders-img" src="/static/folders.jpg" alt="Folders" onerror="this.style.display='none'">
    <div class="chip-row" id="chip-row">
      <span class="chip-empty">No folders added</span>
    </div>
    <button class="btn-add" onclick="openFolderModal()" title="Add folder">+</button>
  </div>

  <!-- ═══ LOG CARD ═══ -->
  <div class="card log">
    <div class="log-icon-col">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#2a5c6a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <polyline points="9 9 12 12 9 15"/>
        <line x1="15" y1="12" x2="15.01" y2="12"/>
      </svg>
    </div>
    <div class="log-text-col" id="log-box"></div>
  </div>

</div>

<!-- Drive modal -->
<div class="overlay" id="drive-modal">
  <div class="modal">
    <h2>Connect Google Drive</h2>
    <p>A browser tab will open for Google sign-in.<br>Return here after completing sign-in.</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeDriveModal()">Cancel</button>
      <button class="btn-primary" onclick="startOAuth()">Open Google Sign-in →</button>
    </div>
  </div>
</div>

<!-- Folder modal -->
<div class="overlay" id="folder-modal">
  <div class="modal">
    <h2>Add Source Folder</h2>
    <input id="folder-input" type="text" placeholder="C:\Users\You\Documents" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeFolderModal()">Cancel</button>
      <button class="btn-primary" onclick="addFolder()">Add →</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);

function toast(msg, ms=2600) {
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),ms);
}
async function api(url, o={}) {
  try { const r=await fetch(url,o); return r.json(); } catch { return {}; }
}
function fmt(s) {
  if(!s) return null;
  try { return new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch { return s; }
}
function fmtDate(s) {
  if(!s) return null;
  try { return new Date(s).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}); }
  catch { return s; }
}

async function loadStatus() {
  const d = await api('/api/status');
  const dot=$('dot'), run=$('btn-run'), pause=$('btn-pause');
  if(!d||d.error){ dot.className='err'; return; }
  dot.className = d.running ? 'busy' : d.configured ? '' : 'off';
  if(d.running){ run.classList.add('running'); pause.disabled=false; }
  else { run.classList.remove('running'); pause.disabled=true; }
  // Time val: show next run time (HH:MM) or last run
  const tv = $('time-val');
  const dv = $('date-val');
  if(d.next_run) {
    try { const dt=new Date(d.next_run); tv.textContent=dt.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',hour12:false}); } catch{}
  }
  if(d.last_run) { dv.textContent=fmtDate(d.last_run)||'—'; }
  if(d.logs?.length) renderLogs(d.logs);
}

function renderLogs(lines) {
  const b=$('log-box'); b.innerHTML='';
  lines.slice(-80).forEach(l=>{
    const p=document.createElement('p'); p.textContent=l;
    p.className=/error|fail/i.test(l)?'err':/warn/i.test(l)?'warn':/success|complet|done/i.test(l)?'ok':'info';
    b.appendChild(p);
  });
  b.scrollTop=b.scrollHeight;
}

async function loadDrives() {
  const d=await api('/api/drives');
  const remotes=d.remotes||[];
  const fill=$('storage-fill'), lbl=$('storage-lbl'), btn=$('btn-add-drive');
  if(remotes.length){
    const r=remotes[0];
    fill.style.width=Math.min(r.usage_pct||0,100)+'%';
    lbl.textContent=r.name||'Connected';
    btn.style.visibility='hidden';
  }else{
    fill.style.width='0%'; lbl.textContent='No drive connected';
    btn.style.visibility='visible';
  }
}

async function loadSources() {
  const d=await api('/api/sources');
  const sources=d.sources||[];
  const row=$('chip-row');
  if(!sources.length){ row.innerHTML='<span class="chip-empty">No folders added</span>'; return; }
  row.innerHTML=sources.map((s,i)=>`
    <div class="chip">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="#29b6f6"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span title="${s.path}">${s.path.split('\\').pop()||s.path.split('/').pop()||s.path}</span>
      <button class="del" onclick="removeSource(${i})">✕</button>
    </div>`).join('');
  window._sources=sources;
}
async function removeSource(i) {
  const s=window._sources?.[i]; if(!s) return;
  const fd=new FormData(); fd.append('path',s.path);
  await api('/api/sources/remove',{method:'POST',body:fd}); loadSources();
}

async function runBackup() {
  const r=await api('/api/action/run',{method:'POST'});
  r.error ? toast('⚠ '+r.error) : (toast('▶ Backup started'), loadStatus());
}
async function pauseBackup() { await api('/api/action/pause',{method:'POST'}); toast('⏸ Paused'); loadStatus(); }
async function verifyBackup() { toast('Verifying…',6000); const r=await api('/api/action/verify',{method:'POST'}); toast(r.ok?'✓ Verified OK':'⚠ Verify failed'); }

function openDriveModal(){ $('drive-modal').classList.add('open'); }
function closeDriveModal(){ $('drive-modal').classList.remove('open'); }
async function startOAuth(){
  closeDriveModal(); toast('Opening Google sign-in…',6000);
  const r=await api('/api/drives/wizard',{method:'POST'});
  if(r.error){ toast('⚠ '+r.error,6000); return; }
  if(r.auth_url) window.open(r.auth_url,'_blank');
  setTimeout(()=>{ loadDrives(); loadStatus(); },12000);
}

function openFolderModal(){ $('folder-modal').classList.add('open'); $('folder-input').value=''; setTimeout(()=>$('folder-input').focus(),80); }
function closeFolderModal(){ $('folder-modal').classList.remove('open'); }
async function addFolder(){
  const p=$('folder-input').value.trim(); if(!p) return;
  const fd=new FormData(); fd.append('path',p);
  const r=await api('/api/sources/add',{method:'POST',body:fd});
  r.error ? toast('⚠ '+r.error) : (toast('Folder added'), loadSources());
  closeFolderModal();
}
$('folder-input').addEventListener('keydown',e=>{ if(e.key==='Enter') addFolder(); });
['drive-modal','folder-modal'].forEach(id=>$(id).addEventListener('click',function(e){ if(e.target===this) this.classList.remove('open'); }));

function refresh(){ loadStatus(); loadDrives(); loadSources(); }
refresh(); setInterval(refresh,5000);
</script>
</body>
</html>
